name: Build KAP-110 firmware

# Builds a custom OpenWrt 25.12.5 image for the Kenstel KAP-110 (IPQ4018).
# The device profile lives in target/linux/ipq40xx/ in this repo and is copied
# into a fresh OpenWrt checkout before building.
#
# Trigger manually from the Actions tab, or by pushing a change under
# target/linux/ipq40xx/.

on:
  workflow_dispatch:
  push:
    paths:
      - 'target/linux/ipq40xx/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  OPENWRT_VERSION: v25.12.5

jobs:
  build:
    name: Build ipq40xx firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout this repository (device profile)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # NOTE: do NOT list python3-distutils - it was removed in Ubuntu
          # 24.04+ and its absence fails the whole apt-get run (exit 100).
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk git \
            libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget bzip2 xz-utils \
            ecj fastjar java-propose-classpath \
            python3-jsonschema python3-yaml ccache

      - name: Free disk space
        # GitHub runners ship with ~25GB free; a full ipq40xx toolchain build
        # needs considerably more than that.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Cache OpenWrt download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ env.OPENWRT_VERSION }}-${{ runner.os }}
          restore-keys: openwrt-dl-${{ env.OPENWRT_VERSION }}-
            openwrt-dl-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.OPENWRT_VERSION }}-${{ runner.os }}
          restore-keys: ccache-${{ env.OPENWRT_VERSION }}-

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=/home/runner/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"
          ccache --max-size=5G
          ccache -s

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch "$OPENWRT_VERSION" \
            https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          git log -1 --oneline
          echo "OpenWrt revision built:"
          git rev-parse HEAD

      - name: Copy KAP-110 device profile into the tree
        run: |
          cp -rv "$GITHUB_WORKSPACE/target/linux/ipq40xx/." openwrt/target/linux/ipq40xx/
          # image/Makefile only includes generic.mk, so the device stanza must be
          # appended there - a separate .mk file would never be sourced.
          cp -v "$GITHUB_WORKSPACE/patches/kenstel-kap110-ipq40xx.patch" \
                openwrt/target/linux/ipq40xx/image/generic.mk
          # make the new board appear in `make menuconfig`
          touch openwrt/target/linux/ipq40xx/Makefile
          cd openwrt
          echo "--- stanza registered? ---"
          grep -n 'kenstel_kap110' target/linux/ipq40xx/image/generic.mk
          echo "--- dts present? ---"
          ls -l target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4018-kenstel-kap110.dts

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        working-directory: openwrt
        # Non-interactive config equivalent of:
        #   make menuconfig  ->  ipq40xx / generic / Kenstel KAP-110
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          # NOTE: the device symbol includes the SUBTARGET:
          #   CONFIG_TARGET_<target>_<subtarget>_DEVICE_<board>
          # Writing CONFIG_TARGET_ipq40xx_DEVICE_... silently does nothing and
          # `make defconfig` leaves every device unselected with no error.
          CONFIG_TARGET_ipq40xx_generic_DEVICE_kenstel_kap110=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_ath10k-firmware-qca9888-ct=y
          CONFIG_PACKAGE_kmod-usb-acm=y
          CONFIG_DEVEL=y
          CONFIG_AUTOREMOVE=y
          CONFIG_IMAGEOPT=y
          CONFIG_CCACHE=y
          EOF
          make defconfig
          # A target/subtarget change often needs a second pass to settle.
          make defconfig

      - name: Diagnose target selection
        working-directory: openwrt
        # Prints everything needed to diagnose "device missing from .config".
        # If this step is ever removed, failures here become unexplainable.
        run: |
          echo "===== CONFIG_TARGET_* in .config ====="
          grep -E '^CONFIG_TARGET' .config || echo "(NO CONFIG_TARGET AT ALL)"
          echo
          echo "===== every *_DEVICE_* symbol ====="
          grep -E '_DEVICE_' .config || echo "(none)"
          echo
          echo "===== .config size / mtime ====="
          ls -l .config
          echo
          echo "===== generic.mk: is our stanza present? ====="
          grep -n 'kenstel' target/linux/ipq40xx/image/generic.mk || echo "STANZA MISSING"
          echo
          echo "===== what devices does OpenWrt think ipq40xx/generic has? ====="
          grep -c 'TARGET_DEVICES +=' target/linux/ipq40xx/image/generic.mk
          echo
          echo "===== DTS files (first 10 + ours) ====="
          ls target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/ | head -10
          ls -l target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/ | grep kenstel || echo "DTS MISSING"
          echo
          echo "===== subtarget files present ====="
          ls target/linux/ipq40xx/image/
          echo
          echo "===== does the target Makefile declare the subtarget? ====="
          grep -nE 'SUBTARGET|TARGET_NAME' target/linux/ipq40xx/Makefile | head

      - name: Verify the board is selected
        working-directory: openwrt
        run: |
          echo "--- all ipq40xx devices ENABLED (=y) ---"
          grep -E '^CONFIG_TARGET_ipq40xx_generic_DEVICE_.*=y' .config || echo "(NONE ENABLED)"
          echo "--- required check ---"
          grep -E '^CONFIG_TARGET_ipq40xx_generic_DEVICE_kenstel_kap110=y' .config || {
            echo "::error::kenstel_kap110 is not selected in .config"
            echo "Symbol must be CONFIG_TARGET_ipq40xx_generic_DEVICE_kenstel_kap110"
            exit 1
          }
          echo "kenstel_kap110 selected OK"
          echo "--- selected devices (final) ---"
          grep -E '^CONFIG_TARGET_.*_DEVICE_.*=y' .config

      - name: Validate the device tree with host dtc
        working-directory: openwrt
        # Real DTS syntax check WITHOUT compiling the kernel or toolchain.
        # `make tools/install` builds the host dtc in ~2 min; the kernel and
        # cross-toolchain are not needed to preprocess + compile a .dts.
        # This turns a 45-minute failure into a ~3-minute one.
        run: |
          set -e
          DTS=target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4018-kenstel-kap110.dts

          echo "===== 1. structural check ====="
          python3 - "$DTS" <<'PYEOF'
          import re, sys
          lines = open(sys.argv[1], encoding="utf-8").read().split("\n")
          depth, stack, bad = 0, [], []
          for i, raw in enumerate(lines, 1):
              s = re.sub(r"/\*.*?\*/", " ", raw, flags=re.S)
              s = re.sub(r"//[^\n]*", " ", s)
              s = re.sub(r'"[^"\n]*"', '""', s)
              for ch in s:
                  if ch == "{":
                      depth += 1; stack.append(i)
                  elif ch == "}":
                      if not stack: bad.append(f"line {i}: unmatched closing brace")
                      else: stack.pop()
                      depth -= 1
          for ln in stack: bad.append(f"line {ln}: unclosed brace")
          if depth: bad.append(f"final depth {depth}")
          for b in bad: print("::error::", b)
          print("brace depth:", depth, "problems:", len(bad))
          PYEOF

          echo "===== 2. install device-tree-compiler ====="
          # NOT `make tools/install`: dtc is not in OpenWrt's tools/ tree. It
          # ships with the kernel source and only exists after the kernel is
          # prepared (which needs the full cross-toolchain).
          # The distro package is the fast, dependency-free way to get dtc.
          sudo apt-get install -y device-tree-compiler
          DTC=$(command -v dtc)
          echo "dtc: ${DTC:-NOT FOUND}"
          dtc --version 2>&1 | head -1
          if [ -z "$DTC" ]; then
            echo "::error::dtc unavailable - DTS would go unvalidated"
            exit 1
          fi

          echo "===== 3. preprocess + compile ====="
          STAGE=/tmp/dtsstage
          rm -rf "$STAGE"
          mkdir -p "$STAGE/qcom" "$STAGE/include/dt-bindings"/{soc,clock,interrupt-controller}
          KVER=v6.12
          RAW=https://raw.githubusercontent.com/torvalds/linux/$KVER

          # OpenWrt's tree holds only BOARD .dts files. The SoC description
          # (qcom-ipq4019.dtsi) and the dt-bindings headers come from the kernel
          # source, which is not unpacked until after target/linux is prepared.
          # Fetch the transitive include set so this check needs no kernel build.
          #
          # NOTE: dt-bindings/soc/qcom,tcsr.h does NOT exist in torvalds v6.12
          # (that dir has only apr/gpr/gsbi/rpmh-rsc). It comes from Qualcomm's
          # qcom-dts tree, which OpenWrt pulls in as a kernel patch. Try both.
          fetch() { # url dest
            curl -sSfL --max-time 40 "$1" -o "$2" \
              || { echo "    MISSING: $1"; return 1; }
            echo "    ok $(basename "$2")"
          }

          echo "  SoC descriptors:"
          fetch "$RAW/arch/arm/boot/dts/qcom/qcom-ipq4019.dtsi" "$STAGE/qcom/qcom-ipq4019.dtsi"
          # NOTE: there is no qcom-ipq4018.dtsi upstream; qcom-ipq4019.dtsi is
          # self-contained (it includes only clock/qcom,gcc-ipq4019.h,
          # interrupt-controller/arm-gic.h and irq.h).

          echo "  dt-bindings:"
          for h in \
            clock/qcom,gcc-ipq4019.h \
            interrupt-controller/arm-gic.h \
            interrupt-controller/irq.h \
            gpio/gpio.h \
            input/input.h \
            leds/common.h ; do
            mkdir -p "$STAGE/include/dt-bindings/$(dirname "$h")"
            fetch "$RAW/include/dt-bindings/$h" "$STAGE/include/dt-bindings/$h"
          done

          # dt-bindings/soc/qcom,tcsr.h exists in NEITHER torvalds linux v6.12
          # (that dir has only apr/gpr/gsbi/rpmh-rsc) nor the OpenWrt tree - it
          # ships in Qualcomm's own kernel source, which OpenWrt downloads during
          # target/linux prepare. For a syntax check the numeric values are
          # irrelevant, only the macro names must exist, so stub them.
          cat > "$STAGE/include/dt-bindings/soc/qcom,tcsr.h" <<'STUB'
          #ifndef __DT_BINDINGS_SOC_QCOM_TCSR_H
          #define __DT_BINDINGS_SOC_QCOM_TCSR_H
          #define TCSR_WIFI_GLB_CFG 0
          #define TCSR_ESS_PSGMII 0
          #define TCSR_USB_HSPHY_HOST_MODE 0
          #define TCSR_WIFI_NOC_MEMTYPE_M0_M2 0
          #endif
          STUB
          echo "    stubbed qcom,tcsr.h (syntax check only)"

          # input.h includes "linux-event-codes.h" (a UAPI header, not a
          # dt-binding). Rather than hand-maintaining the transitive list - which
          # is how the previous two runs failed - resolve any remaining missing
          # header automatically from the upstream kernel.
          echo "  resolving transitive includes:"
          for i in 1 2 3 4 5 6 7 8; do
            missing=$(cpp -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
                        -I"$STAGE/qcom" -I"$STAGE" -I"$STAGE/include" \
                        -M "$DTS" 2>&1 >/dev/null | grep -oE '"[^"]+\.h"' | tr -d '"' | sort -u)
            still=""
            for h in $missing; do
              [ -f "$STAGE/include/$h" ] && continue
              for cand in "include/uapi/$h" "include/$h"; do
                if fetch "$RAW/$cand" "$STAGE/include/$h" >/dev/null 2>&1; then
                  echo "    resolved $h -> $cand"; break
                fi
              done
              [ -f "$STAGE/include/$h" ] || still="$still $h"
            done
            [ -z "$still" ] && break
            echo "    unresolved:$still"
          done

          echo "  staged files:"; find "$STAGE" -type f | sed "s|$STAGE/||"

          # Preprocess with the host cpp, exactly as the kernel build does.
          cpp -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
            -I"$STAGE/qcom" -I"$STAGE" -I"$STAGE/include" \
            -o "$STAGE/kap110.dts.pp" "$DTS"
          echo "preprocess OK ($(wc -l < "$STAGE/kap110.dts.pp") lines)"

          "$DTC" -O dtb \
            -Wno-interrupt_provider -Wno-unique_unit_address \
            -Wno-unit_address_vs_reg -Wno-avoid_unnecessary_addr_size \
            -Wno-alias_paths -Wno-graph_child_address -Wno-simple_bus_reg \
            -o "$STAGE/kap110.dtb" "$STAGE/kap110.dts.pp"
          echo "DTC COMPILE OK"
          ls -l "$STAGE/kap110.dtb"

      - name: Build
        working-directory: openwrt
        run: make -j$(nproc) V=s

      - name: Collect images
        working-directory: openwrt
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find bin/targets/ipq40xx/generic -type f \
            \( -name '*kenstel_kap110*' -o -name 'sha256sums*' \) \
            -exec ls -lh {} \;
          find bin/targets/ipq40xx/generic -type f \
            \( -name '*kenstel_kap110*' -o -name 'sha256sums*' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;

      - name: Summary
        run: |
          {
            echo "### KAP-110 firmware built"
            echo
            echo "| File | Size |"
            echo "|------|------|"
            for f in artifacts/*; do
              [ -f "$f" ] && echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "### Which image to flash first"
            echo
            echo '**\`initramfs-fit-uImage.itb\`** - boots from RAM, writes nothing to'
            echo 'flash. Copy to a FAT32 USB stick, insert it, power on while holding'
            echo 'the reset button. Use this first.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-kenstel-kap110
          path: artifacts/
          if-no-files-found: error
          retention-days: 90