name: Build KAP-110 firmware

# Builds a custom OpenWrt 25.12.5 image for the Kenstel KAP-110 (IPQ4018).
# The device profile lives in target/linux/ipq40xx/ in this repo and is copied
# into a fresh OpenWrt checkout before building.
#
# Trigger manually from the Actions tab, or by pushing a change under
# target/linux/ipq40xx/.

on:
  workflow_dispatch:
  push:
    paths:
      - 'target/linux/ipq40xx/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  OPENWRT_VERSION: v25.12.5

jobs:
  build:
    name: Build ipq40xx firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout this repository (device profile)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # NOTE: do NOT list python3-distutils - it was removed in Ubuntu
          # 24.04+ and its absence fails the whole apt-get run (exit 100).
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk git \
            libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget bzip2 xz-utils \
            ecj fastjar java-propose-classpath \
            python3-jsonschema python3-yaml ccache

      - name: Free disk space
        # GitHub runners ship with ~25GB free; a full ipq40xx toolchain build
        # needs considerably more than that.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Cache OpenWrt download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ env.OPENWRT_VERSION }}-${{ runner.os }}
          restore-keys: openwrt-dl-${{ env.OPENWRT_VERSION }}-
            openwrt-dl-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.OPENWRT_VERSION }}-${{ runner.os }}
          restore-keys: ccache-${{ env.OPENWRT_VERSION }}-

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=/home/runner/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"
          ccache --max-size=5G
          ccache -s

      - name: Clone OpenWrt
        run: |
          # This repository is named "Openwrt", so the runner workspace path
          # collides with a bare `git clone ... openwrt`. Remove any stale
          # directory first so the step is idempotent on re-runs.
          rm -rf openwrt
          git clone --depth 1 --branch "$OPENWRT_VERSION" \
            https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          git log -1 --oneline
          echo "OpenWrt revision built:"
          git rev-parse HEAD

      - name: Copy KAP-110 device profile into the tree
        run: |
          cp -rv "$GITHUB_WORKSPACE/target/linux/ipq40xx/." openwrt/target/linux/ipq40xx/
          # image/Makefile only includes generic.mk, so the device stanza must be
          # appended there - a separate .mk file would never be sourced.
          cp -v "$GITHUB_WORKSPACE/patches/kenstel-kap110-ipq40xx.patch" \
                openwrt/target/linux/ipq40xx/image/generic.mk
          # make the new board appear in `make menuconfig`
          touch openwrt/target/linux/ipq40xx/Makefile
          cd openwrt
          echo "--- stanza registered? ---"
          grep -n 'kenstel_kap110' target/linux/ipq40xx/image/generic.mk
          echo "--- dts present? ---"
          ls -l target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4018-kenstel-kap110.dts

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        working-directory: openwrt
        # Non-interactive config equivalent of:
        #   make menuconfig  ->  ipq40xx / generic / Kenstel KAP-110
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          # NOTE: the device symbol includes the SUBTARGET:
          #   CONFIG_TARGET_<target>_<subtarget>_DEVICE_<board>
          # Writing CONFIG_TARGET_ipq40xx_DEVICE_... silently does nothing and
          # `make defconfig` leaves every device unselected with no error.
          CONFIG_TARGET_ipq40xx_generic_DEVICE_kenstel_kap110=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_ath10k-firmware-qca9888-ct=y
          CONFIG_PACKAGE_kmod-usb-acm=y
          CONFIG_DEVEL=y
          CONFIG_AUTOREMOVE=y
          CONFIG_IMAGEOPT=y
          CONFIG_CCACHE=y
          EOF
          make defconfig
          # A target/subtarget change often needs a second pass to settle.
          make defconfig

      - name: Diagnose target selection
        working-directory: openwrt
        # Prints everything needed to diagnose "device missing from .config".
        # If this step is ever removed, failures here become unexplainable.
        run: |
          echo "===== CONFIG_TARGET_* in .config ====="
          grep -E '^CONFIG_TARGET' .config || echo "(NO CONFIG_TARGET AT ALL)"
          echo
          echo "===== every *_DEVICE_* symbol ====="
          grep -E '_DEVICE_' .config || echo "(none)"
          echo
          echo "===== .config size / mtime ====="
          ls -l .config
          echo
          echo "===== generic.mk: is our stanza present? ====="
          grep -n 'kenstel' target/linux/ipq40xx/image/generic.mk || echo "STANZA MISSING"
          echo
          echo "===== what devices does OpenWrt think ipq40xx/generic has? ====="
          grep -c 'TARGET_DEVICES +=' target/linux/ipq40xx/image/generic.mk
          echo
          echo "===== DTS files (first 10 + ours) ====="
          ls target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/ | head -10
          ls -l target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/ | grep kenstel || echo "DTS MISSING"
          echo
          echo "===== subtarget files present ====="
          ls target/linux/ipq40xx/image/
          echo
          echo "===== does the target Makefile declare the subtarget? ====="
          grep -nE 'SUBTARGET|TARGET_NAME' target/linux/ipq40xx/Makefile | head

      - name: Verify the board is selected
        working-directory: openwrt
        run: |
          echo "--- all ipq40xx devices ENABLED (=y) ---"
          grep -E '^CONFIG_TARGET_ipq40xx_generic_DEVICE_.*=y' .config || echo "(NONE ENABLED)"
          echo "--- required check ---"
          grep -E '^CONFIG_TARGET_ipq40xx_generic_DEVICE_kenstel_kap110=y' .config || {
            echo "::error::kenstel_kap110 is not selected in .config"
            echo "Symbol must be CONFIG_TARGET_ipq40xx_generic_DEVICE_kenstel_kap110"
            exit 1
          }
          echo "kenstel_kap110 selected OK"
          echo "--- selected devices (final) ---"
          grep -E '^CONFIG_TARGET_.*_DEVICE_.*=y' .config

      - name: Verify sysupgrade handlers are present
        working-directory: openwrt
        # Without platform_check/returning 0, LuCI refuses the image with
        # "Firmware upgrade is not implemented for this platform" - but only at
        # flash time, long after a successful build. Catch it here instead.
        run: |
          PLAT=target/linux/ipq40xx/base-files/lib/upgrade/platform.sh
          echo "--- platform.sh ---"
          # sbin/sysupgrade aborts with "Firmware upgrade is not implemented for
          # this platform." unless platform_check_image is DEFINED. Defining a
          # differently-named function (platform_check) does nothing - which is
          # the bug that produced that exact error twice.
          if ! grep -q '^platform_check_image()' "$PLAT"; then
            echo "::error::platform_check_image not defined - sysupgrade will be refused"
            exit 1
          fi
          echo "platform_check_image defined"
          if grep -qE '^platform_check\(\)' "$PLAT"; then
            echo "::error::found platform_check(), which sysupgrade never calls"
            exit 1
          fi
          # This file REPLACES an upstream file; make sure nothing was lost.
          for b in asus,map-ac1300 zte,mf18a glinet,gl-b2200 platform_copy_config; do
            grep -q "$b" "$PLAT" || { echo "::error::lost upstream content: $b"; exit 1; }
          done
          grep -q 'kenstel,kap110' "$PLAT" || { echo "::error::KAP-110 case missing"; exit 1; }
          # PART_NAME must be the stock partition label 'rootfs'. If it is
          # 'firmware', mtd finds no such partition, falls back to the literal
          # default 'image', and the upgrade writes nothing at all.
          grep -q '^PART_NAME=rootfs' "$PLAT" \
            || { echo "::error::PART_NAME must be rootfs, got: $(grep '^PART_NAME=' "$PLAT")"; exit 1; }
          echo "upstream handlers intact, KAP-110 case present, PART_NAME=rootfs"
          # The rootfs partition is a UBI device carrying the stock volumes
          # kernel/ubi_rootfs/rootfs_data. A raw "mtd write" (default_do_upgrade)
          # cannot write it: "Could not open mtd device: rootfs". The image is a
          # tar of UBI volumes, so nand_do_upgrade is the only correct path.
          grep -q 'CI_UBIPART="rootfs"' "$PLAT" \
            || { echo "::error::CI_UBIPART=rootfs not set"; exit 1; }
          # find_mtd_index() greps /proc/mtd, which is not readable inside the
          # stage2 ramdisk, so the index must be captured on the live system via
          # platform_pre_upgrade (which runs before switch_to_ramfs).
          grep -q '^platform_pre_upgrade()' "$PLAT" \
            || { echo "::error::platform_pre_upgrade missing - MTD index cannot be captured"; exit 1; }
          grep -q 'KAP110_ROOTFS_MTD' "$PLAT" \
            || { echo "::error::KAP110_ROOTFS_MTD fallback missing"; exit 1; }
          # The exported variable was NOT enough in testing; platform_pre_upgrade
          # must also save /proc/mtd, which survives the stage2 pivot because
          # /tmp does. Without this the lookup returns empty again.
          grep -q 'kap110.proc.mtd' "$PLAT" \
            || { echo "::error::no /tmp/kap110.proc.mtd cache - MTD lookup will fail in stage2"; exit 1; }
          grep -q 'cp /proc/mtd /tmp/kap110.proc.mtd' "$PLAT" \
            || { echo "::error::platform_pre_upgrade does not capture /proc/mtd"; exit 1; }
          awk '/^platform_do_upgrade\(\)/,/^}/' "$PLAT" | grep -q nand_do_upgrade \
            || { echo "::error::KAP-110 do_upgrade must use nand_do_upgrade, not default_do_upgrade"; exit 1; }
          for t in ubiattach ubimkvol ubirmvol ubiupdatevol; do
            grep -q "$t" "$PLAT" || { echo "::error::$t missing from RAMFS_COPY_BIN"; exit 1; }
          done
          echo "UBI upgrade path configured (nand_do_upgrade + UBI tools)"
          echo "--- 02_network must use the correct helper arity ---"
          NETWORK=target/linux/ipq40xx/base-files/etc/board.d/02_network
          # ucidef_set_interfaces_lan_wan takes exactly TWO args: LAN devices as
          # ONE space-separated string, then WAN. A "bridge lan ..." prefix sets
          # network.lan.device to a literal non-interface and silently drops the
          # ports - the AP then boots with no reachable LAN and nothing warns.
          if grep -qE '^\s*ucidef_set_interfaces_lan_wan\s+bridge' "$NETWORK"; then
            echo "::error::ucidef_set_interfaces_lan_wan called with a 'bridge' prefix"
            echo "  correct form: ucidef_set_interfaces_lan_wan \"lan0 lan1 lan2 lan3\" \"wan\""
            exit 1
          fi
          if grep -v '^[[:space:]]*#' "$NETWORK" | grep -q "ucidef_set_interfaces_lan_wan"; then
            echo "::warning::ucidef helper present; its JSON did not merge on this board"
          fi
          if grep -qE '"eth[0-9]+\.[0-9]+"' "$NETWORK"; then
            echo "::warning::02_network still references tagged VLANs"
          else
            echo "02_network clean (untagged DSA ports only)"
          fi
          # 02_network writes /etc/config/network explicitly; the ipaddr appears
          # as a UCI "list ipaddr" line rather than a network.lan.ipaddr option.
          grep -q "192.168.1.1" "$NETWORK" \
            || { echo "::error::expected LAN ip 192.168.1.1 in 02_network"; exit 1; }
          grep -q "list ipaddr" "$NETWORK" \
            || { echo "::error::02_network assigns no address to lan"; exit 1; }
          # The bridge must be an explicit 'config device' with list ports.
          # ucidef_set_interfaces_lan_wan's JSON did not survive the
          # config_generate merge on this board; netifd fell back to a bridge of
          # the CPU port only (list ports 'eth0'), leaving lan0-lan3 unenslaved.
          grep -q "option type 'bridge'" "$NETWORK" \
            || { echo "::error::no explicit bridge device in 02_network"; exit 1; }
          for p in lan0 lan1 lan2 lan3; do
            grep -q "list ports '$p'" "$NETWORK" \
              || { echo "::error::bridge is missing port $p"; exit 1; }
          done
          if grep -v '^[[:space:]]*#' "$NETWORK" | grep -q "list ports 'eth0'"; then
            echo "::error::CPU port eth0 must not be listed; netifd adds it itself"
            exit 1
          fi
          echo "LAN address configured (192.168.1.1/24), bridge = lan0-lan3"

      - name: Validate the device tree with host dtc
        working-directory: openwrt
        # Real DTS syntax check WITHOUT compiling the kernel or toolchain.
        # `make tools/install` builds the host dtc in ~2 min; the kernel and
        # cross-toolchain are not needed to preprocess + compile a .dts.
        # This turns a 45-minute failure into a ~3-minute one.
        run: |
          set -e
          DTS=target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4018-kenstel-kap110.dts

          echo "===== 1. structural check ====="
          python3 - "$DTS" <<'PYEOF'
          import re, sys
          lines = open(sys.argv[1], encoding="utf-8").read().split("\n")
          depth, stack, bad = 0, [], []
          for i, raw in enumerate(lines, 1):
              s = re.sub(r"/\*.*?\*/", " ", raw, flags=re.S)
              s = re.sub(r"//[^\n]*", " ", s)
              s = re.sub(r'"[^"\n]*"', '""', s)
              for ch in s:
                  if ch == "{":
                      depth += 1; stack.append(i)
                  elif ch == "}":
                      if not stack: bad.append(f"line {i}: unmatched closing brace")
                      else: stack.pop()
                      depth -= 1
          for ln in stack: bad.append(f"line {ln}: unclosed brace")
          if depth: bad.append(f"final depth {depth}")
          for b in bad: print("::error::", b)
          print("brace depth:", depth, "problems:", len(bad))
          PYEOF

          echo "===== 2. install device-tree-compiler ====="
          # NOT `make tools/install`: dtc is not in OpenWrt's tools/ tree. It
          # ships with the kernel source and only exists after the kernel is
          # prepared (which needs the full cross-toolchain).
          # The distro package is the fast, dependency-free way to get dtc.
          sudo apt-get install -y device-tree-compiler
          DTC=$(command -v dtc)
          echo "dtc: ${DTC:-NOT FOUND}"
          dtc --version 2>&1 | head -1
          if [ -z "$DTC" ]; then
            echo "::error::dtc unavailable - DTS would go unvalidated"
            exit 1
          fi

          echo "===== 3. preprocess + compile ====="
          STAGE=/tmp/dtsstage
          rm -rf "$STAGE"
          # Create the FULL tree up front. curl exits 23 ("Failure writing output
          # to destination") if the destination directory is missing, and that
          # happened because the patch staging dir was created after first use.
          mkdir -p \
            "$STAGE/qcom" \
            "$STAGE/arch/arm/boot/dts/qcom" \
            "$STAGE/include/dt-bindings/soc" \
            "$STAGE/include/dt-bindings/clock" \
            "$STAGE/include/dt-bindings/interrupt-controller" \
            "$STAGE/include/dt-bindings/gpio" \
            "$STAGE/include/dt-bindings/input" \
            "$STAGE/include/dt-bindings/leds" \
            "$STAGE/patches"
          KVER=v6.12
          RAW=https://raw.githubusercontent.com/torvalds/linux/$KVER

          # Fail loudly if any destination is not writable, before curl(23)
          # failures turn into confusing "MISSING" messages later.
          for d in "$STAGE" "$STAGE/arch/arm/boot/dts/qcom" "$STAGE/include" "$STAGE/patches"; do
            if ! touch "$d/.wtest" 2>/dev/null; then
              echo "::error::staging dir not writable: $d"; exit 1
            fi
            rm -f "$d/.wtest"
          done

          # OpenWrt's tree holds only BOARD .dts files. The SoC description
          # (qcom-ipq4019.dtsi) and the dt-bindings headers come from the kernel
          # source, which is not unpacked until after target/linux is prepared.
          # Fetch the transitive include set so this check needs no kernel build.
          #
          # NOTE: dt-bindings/soc/qcom,tcsr.h does NOT exist in torvalds v6.12
          # (that dir has only apr/gpr/gsbi/rpmh-rsc). It comes from Qualcomm's
          # qcom-dts tree, which OpenWrt pulls in as a kernel patch. Try both.
          fetch() { # url dest
            if ! curl -sSfL --max-time 40 "$1" -o "$2" 2>"$STAGE/fetch.err"; then
              echo "    MISSING: $1"
              echo "      curl said: $(head -1 "$STAGE/fetch.err")"
              echo "      dest dir exists: $([ -d "$(dirname "$2")" ] && echo yes || echo NO)"
              return 1
            fi
            echo "    ok $(basename "$2")"
          }

          echo "  SoC descriptors:"
          # Fetch to arch/... for `patch -p1` (its paths are a/arch/boot/dts/qcom/...)
          # and mirror into qcom/ as the -I include directory.
          fetch "$RAW/arch/arm/boot/dts/qcom/qcom-ipq4019.dtsi" \
                "$STAGE/arch/arm/boot/dts/qcom/qcom-ipq4019.dtsi" \
            && cp "$STAGE/arch/arm/boot/dts/qcom/qcom-ipq4019.dtsi" "$STAGE/qcom/"
          # NOTE: there is no qcom-ipq4018.dtsi upstream; qcom-ipq4019.dtsi is
          # self-contained (it includes only clock/qcom,gcc-ipq4019.h,
          # interrupt-controller/arm-gic.h and irq.h).

          echo "  dt-bindings:"
          for h in \
            clock/qcom,gcc-ipq4019.h \
            interrupt-controller/arm-gic.h \
            interrupt-controller/irq.h \
            gpio/gpio.h \
            input/input.h \
            leds/common.h ; do
            mkdir -p "$STAGE/include/dt-bindings/$(dirname "$h")"
            fetch "$RAW/include/dt-bindings/$h" "$STAGE/include/dt-bindings/$h"
          done

          # dt-bindings/soc/qcom,tcsr.h exists in NEITHER torvalds linux v6.12
          # (that dir has only apr/gpr/gsbi/rpmh-rsc) nor the OpenWrt tree - it
          # ships in Qualcomm's own kernel source, which OpenWrt downloads during
          # target/linux prepare. For a syntax check the numeric values are
          # irrelevant, only the macro names must exist, so stub them.
          cat > "$STAGE/include/dt-bindings/soc/qcom,tcsr.h" <<'STUB'
          #ifndef __DT_BINDINGS_SOC_QCOM_TCSR_H
          #define __DT_BINDINGS_SOC_QCOM_TCSR_H
          #define TCSR_WIFI_GLB_CFG 0
          #define TCSR_ESS_PSGMII 0
          #define TCSR_USB_HSPHY_HOST_MODE 0
          #define TCSR_WIFI_NOC_MEMTYPE_M0_M2 0
          #endif
          STUB
          echo "    stubbed qcom,tcsr.h (syntax check only)"

          # input.h includes "linux-event-codes.h" as a BARE filename (quoted, not
          # <angled>), so it must be placed at exactly $STAGE/include/<name>.
          # It lives at include/uapi/linux/input-event-codes.h upstream.
          # Rather than hand-maintaining the list - which failed twice - resolve
          # any remaining missing header automatically, trying both the exact
          # path and the include/uapi/ and include/linux/ variants.
          echo "  applying OpenWrt ipq40xx dts patches:"
          # The switch/CPU-port labels (gmac, switch, swport1-5) do NOT exist in
          # stock Linux - OpenWrt adds them via patches to the target, e.g.
          #   707-arm-dts-ipq4019-add-switch-node.patch
          #   710-arm-dts-qcom-ipq4019-QCA807x-properties.patch
          # Without these the board DTS fails with "Label or path switch not
          # found" even though the DTS is correct.
          mkdir -p "$STAGE/patches" "$STAGE/arch/arm/boot/dts/qcom"
          # The patch paths are a/arch/arm/boot/dts/qcom/... so -p1 must strip
          # the leading dir and land in $STAGE/arch/arm/boot/dts/qcom/.
          # $STAGE/qcom is the -I path; point it at the patched tree.
          # Apply in NUMERIC patch order. OpenWrt applies target patches in
          # sorted order and the hunks can sit close together, so applying them
          # out of order makes a later hunk miss its context.
          # Apply in NUMERIC order and include EVERY dtsi-affecting patch.
          # 705 adds `gmac: ethernet@c080000` which 707's hunk context requires -
          # without it 707 reports "context mismatch" because gmac is absent from
          # stock v6.12 entirely.
          for p in \
            100-ARM-dts-qcom-ipq4019-add-label-to-SCM.patch \
            705-ARM-dts-qcom-ipq4019-Add-description-for-the-IPQESS-.patch \
            707-arm-dts-ipq4019-add-switch-node.patch \
            710-arm-dts-ipq4019-QCA807x-properties.patch \
            712-ARM-dts-qcom-ipq4019-add-reference-label-for-PCIe.patch ; do
            if fetch "https://raw.githubusercontent.com/openwrt/openwrt/v25.12.5/target/linux/ipq40xx/patches-6.12/$p" \
                      "$STAGE/patches/$p"; then
              # git-format patches apply cleanly with patch(1).
              if patch -p1 -d "$STAGE" --no-backup-if-mismatch -s -f \
                   < "$STAGE/patches/$p" 2>"$STAGE/patches/$p.err"; then
                echo "    applied $p"
              else
                echo "    FAILED $p:"
                sed 's/^/      /' "$STAGE/patches/$p.err" | head -8
              fi
            fi
          done
          # Verify the switch node really landed; without it every board DTS
          # using &switch / &swportN fails to compile.
          if grep -q 'swport1' "$STAGE/arch/arm/boot/dts/qcom/qcom-ipq4019.dtsi" 2>/dev/null; then
            echo "    switch node present in patched dtsi"
          else
            echo "    ::error::switch node missing - DTS cannot reference &switch/&swportN"
            exit 1
          fi
          echo "  fetching known transitive headers:"
          # Known case, fetched by its exact upstream path. input.h does
          #   #include "linux-event-codes.h"
          # which resolves to include/uapi/linux/input-event-codes.h upstream.
          # Note the basename is input-event-codes.h, NOT linux-event-codes.h -
          # prefixing the directory with the missing name would look for
          # linux/linux-event-codes.h and 404.
          fetch "$RAW/include/uapi/linux/input-event-codes.h" \
                "$STAGE/include/linux-event-codes.h" && \
            echo "    staged linux-event-codes.h"

          # Generic fallback for anything else still missing.
          for i in 1 2 3 4 5; do
            missing=$(cpp -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
                        -I"$STAGE/qcom" -I"$STAGE" -I"$STAGE/include" \
                        -M "$DTS" 2>&1 >/dev/null | grep -oE '"[^"]+\.h"' | tr -d '"' | sort -u)
            still=""
            for h in $missing; do
              base=$(basename "$h")
              [ -f "$STAGE/include/$base" ] && continue
              [ -f "$STAGE/include/$h" ] && continue
              got=""
              for cand in "include/uapi/linux/$base" "include/linux/$base" \
                          "include/uapi/$h" "include/$h"; do
                if fetch "$RAW/$cand" "$STAGE/include/$base" >/dev/null 2>&1; then
                  echo "    resolved $base -> $cand"; got=1; break
                fi
              done
              [ -n "$got" ] || still="$still $base"
            done
            [ -z "$still" ] && break
            echo "    unresolved:$still (cannot auto-resolve; run will fail)"
            break
          done

          echo "  staged files:"; find "$STAGE" -type f | sed "s|$STAGE/||"

          # Preprocess with the host cpp, exactly as the kernel build does.
          # -I points at the PATCHED tree so the switch/swport labels resolve.
          cpp -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
            -I"$STAGE/arch/arm/boot/dts/qcom" -I"$STAGE" -I"$STAGE/include" \
            -o "$STAGE/kap110.dts.pp" "$DTS"
          echo "preprocess OK ($(wc -l < "$STAGE/kap110.dts.pp") lines)"

          "$DTC" -O dtb \
            -Wno-interrupt_provider -Wno-unique_unit_address \
            -Wno-unit_address_vs_reg -Wno-avoid_unnecessary_addr_size \
            -Wno-alias_paths -Wno-graph_child_address -Wno-simple_bus_reg \
            -o "$STAGE/kap110.dtb" "$STAGE/kap110.dts.pp"
          echo "DTC COMPILE OK"
          ls -l "$STAGE/kap110.dtb"

      - name: Build
        working-directory: openwrt
        run: make -j$(nproc) V=s

      - name: Collect images
        working-directory: openwrt
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find bin/targets/ipq40xx/generic -type f \
            \( -name '*kenstel_kap110*' -o -name 'sha256sums*' \) \
            -exec ls -lh {} \;
          find bin/targets/ipq40xx/generic -type f \
            \( -name '*kenstel_kap110*' -o -name 'sha256sums*' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;

      - name: Summary
        run: |
          {
            echo "### KAP-110 firmware built"
            echo
            echo "| File | Size |"
            echo "|------|------|"
            for f in artifacts/*; do
              [ -f "$f" ] && echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "### Which image to flash first"
            echo
            echo '**\`initramfs-fit-uImage.itb\`** - boots from RAM, writes nothing to'
            echo 'flash. Copy to a FAT32 USB stick, insert it, power on while holding'
            echo 'the reset button. Use this first.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-kenstel-kap110
          path: artifacts/
          if-no-files-found: error
          retention-days: 90